<nav class="bg-gray-900 text-white border-b border-gray-800 sticky top-0 z-50 shadow">
  <div class="max-w-6xl mx-auto px-4 flex justify-between items-center h-16">

    <!-- Logo -->
    <a href="{% url 'tweet:feed' %}" class="font-bold text-xl hover:text-yellow-400 transition">
      ☕ Chai HeadQ
    </a>

    <!-- Search + Links -->
    <div class="flex items-center gap-4">

      <!-- Search Bar -->
      <form method="GET" action="{% url 'tweet:feed' %}" class="relative">
        <input 
          type="text" 
          name="q" 
          value="{{ request.GET.q|default:'' }}"  
          placeholder="Search..."
          class="pl-3 pr-10 py-1 rounded-lg bg-gray-800 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-yellow-400 transition"
        >
        <button type="submit" class="absolute right-1 top-1 text-gray-400 hover:text-yellow-400">
          🔍
        </button>
      </form>

      <!-- Auth Links -->
      {% if user.is_authenticated %}
        <a href="{% url 'tweet:create' %}" class="text-sm font-medium hover:text-yellow-400 transition">Create</a>
        <a href="{% url 'accounts:profile' %}" class="text-sm font-medium hover:text-yellow-400 transition">Profile</a>
        <a href="{% url 'accounts:logout' %}" class="text-sm font-medium text-red-500 hover:text-red-400 transition">Logout</a>
      {% else %} 
        <a href="{% url 'accounts:login' %}" class="text-sm font-medium hover:text-yellow-400 transition">Login</a>
        <a href="{% url 'accounts:register' %}" class="text-sm font-semibold hover:text-yellow-400 transition">Register</a>
      {% endif %}

    </div>
  </div>
</nav>
