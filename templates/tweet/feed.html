{% extends "layout/layout.html" %}

{% block content %}

{% if not user.is_authenticated %}
  <div class="bg-yellow-100 p-4 rounded-xl mb-4 text-center">
    ☕ Join Chai HeadQ to post & like chais  
    <a href="{% url 'accounts:register' %}" class="font-semibold underline">
      Create account
    </a>
  </div>
{% endif %}

<div class="space-y-4">
  {% for tweet in tweets %}
    {% include "tweet/_tweet_card.html" %}
  {% endfor %}
</div>

{% endblock %}
