{% extends "layout/layout.html" %}
{% load tailwind_tags %}

{% block title %}Register - Chai HeadQ{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-64px)] px-4">
    <div class="bg-white dark:bg-gray-800 shadow-md rounded-lg p-8 w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-gray-900 dark:text-white text-center">Create Your Account</h2>

        <form method="POST" action="{% url 'accounts:register' %}" class="space-y-4">
            {% csrf_token %}

            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-200">Username</label>
                <input type="text" name="username" id="username" placeholder="Choose a username"
                    class="mt-1 block w-full rounded-lg border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-yellow-400 focus:border-yellow-400"
                    required>
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-200">Email</label>
                <input type="email" name="email" id="email" placeholder="Your email address"
                    class="mt-1 block w-full rounded-lg border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-yellow-400 focus:border-yellow-400"
                    required>
            </div>

            <div>
                <label for="password1" class="block text-sm font-medium text-gray-700 dark:text-gray-200">Password</label>
                <input type="password" name="password1" id="password1" placeholder="Enter password"
                    class="mt-1 block w-full rounded-lg border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-yellow-400 focus:border-yellow-400"
                    required>
            </div>

            <div>
                <label for="password2" class="block text-sm font-medium text-gray-700 dark:text-gray-200">Confirm Password</label>
                <input type="password" name="password2" id="password2" placeholder="Confirm password"
                    class="mt-1 block w-full rounded-lg border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-yellow-400 focus:border-yellow-400"
                    required>
            </div>

            <button type="submit"
                class="w-full bg-yellow-400 hover:bg-yellow-500 text-white font-semibold py-2 px-4 rounded-lg transition">
                Register
            </button>
        </form>

        <p class="mt-4 text-sm text-gray-600 dark:text-gray-300 text-center">
            Already have an account?
            <a href="{% url 'accounts:login' %}" class="text-yellow-400 hover:underline">Login</a>
        </p>
    </div>
</div>
{% endblock %}
