{% extends "layout/layout.html" %}
{% load tailwind_tags %}

{% block title %}Login - Chai HeadQ{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-64px)] px-4">
  <div class="bg-white dark:bg-gray-800 shadow-md rounded-lg p-8 w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-gray-900 dark:text-white text-center">Login to Chai HeadQ</h2>

    <form method="POST" action="{% url 'accounts:login' %}" class="space-y-4">
      {% csrf_token %}

      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-200">Username</label>
        <input 
          type="text" 
          name="username" 
          id="username" 
          placeholder="Enter your username" 
          class="mt-1 block w-full rounded-lg border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-yellow-400 focus:border-yellow-400"
          required
        >
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-200">Password</label>
        <input 
          type="password" 
          name="password" 
          id="password" 
          placeholder="Enter your password" 
          class="mt-1 block w-full rounded-lg border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-yellow-400 focus:border-yellow-400"
          required
        >
      </div>

      <button type="submit" class="w-full bg-yellow-400 hover:bg-yellow-500 text-white font-semibold py-2 px-4 rounded-lg transition">
        Login
      </button>
    </form>

    <p class="mt-4 text-sm text-gray-600 dark:text-gray-300 text-center">
      Don't have an account? 
      <a href="{% url 'accounts:register' %}" class="text-yellow-400 hover:underline">Register</a>
    </p>
  </div>
</div>
{% endblock %}
%}
