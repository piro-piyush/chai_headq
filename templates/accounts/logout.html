{% extends "layout/layout.html" %}
{% load tailwind_tags %}

{% block title %}Logout - Chai HeadQ{% endblock %}

{% block content %}
<div class="flex justify-center mt-16">
    <div class="bg-white dark:bg-gray-800 shadow-md rounded-2xl p-8 w-full max-w-md text-center">
        <h1 class="text-2xl font-bold mb-4 text-gray-900 dark:text-white">Logout</h1>
        <p class="mb-6 text-gray-600 dark:text-gray-300">
            Are you sure you want to logout from Chai HeadQ?
        </p>

        <form method="POST" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <div class="flex justify-center gap-4">
                <button type="submit"
                    class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-6 rounded-lg transition">
                    Logout
                </button>
                <a href="{% url 'tweet:feed' %}"
                    class="bg-gray-300 dark:bg-gray-700 hover:bg-gray-400 dark:hover:bg-gray-600 text-gray-900 dark:text-white font-semibold py-2 px-6 rounded-lg transition">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
